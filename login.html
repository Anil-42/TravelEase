<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | TravelEase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* Background exactly like image */
    background:
      linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
      url("bg.jpg") no-repeat center center/cover;

    color: #fff;
  }

  .container {
    /* TRANSPARENT GLASS BOX */
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    padding: 35px;
    border-radius: 18px;
    width: 100%;
    max-width: 420px;

    /* Soft border + shadow like image */
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  }

  h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #ffa500;
    font-size: 30px;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border: none;
    border-radius: 10px;

    /* Transparent inputs */
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 15px;
  }

  input::placeholder {
    color: #e0e0e0;
  }

  input:focus {
    outline: none;
    border: 1px solid #ffa500;
  }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;

    /* Rounded orange button like image */
    background: linear-gradient(135deg, #ff9800, #ff7a00);
    border: none;
    border-radius: 35px;

    font-size: 17px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    transition: 0.3s ease;
  }

  button:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 20px rgba(255,165,0,0.5);
  }

  p {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
  }

  a {
    color: #ffa500;
    cursor: pointer;
    text-decoration: none;
    font-weight: bold;
  }

  a:hover {
    text-decoration: underline;
  }

  .hidden {
    display: none;
  }
</style>

</head>
<body>

<div class="container">

  <!-- LOGIN FORM -->
  <div id="loginBox">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a onclick="showRegister()">Register</a></p>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerBox" class="hidden">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="regUsername" placeholder="Username" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a onclick="showLogin()">Login</a></p>
  </div>

</div>

<script>
  function showRegister() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("registerBox").classList.remove("hidden");
  }

  function showLogin() {
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
  }

  // REGISTER
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = regUsername.value;
    const email = regEmail.value;
    const password = regPassword.value;

    const res = await fetch("http://localhost:5000/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();

    if (res.ok) {
      alert("Registration successful! Please login.");
      showLogin();
    } else {
      alert(data.message || "Registration failed");
    }
  });

  // LOGIN
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = loginEmail.value;
    const password = loginPassword.value;

    const res = await fetch("http://localhost:5000/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("userId", data.userId);
      localStorage.setItem("username", data.username);

      alert("Login successful!");
      window.location.href = "index.html";
    } else {
      alert(data.message || "Invalid credentials");
    }
  });
</script>

</body>
</html>
