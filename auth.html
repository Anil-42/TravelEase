<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase | Sign In / Sign Up</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <div class="tab">
                <p class="tablinks" onclick="openForm(event, 'SignIn')" id="defaultOpen"></p>

            </div>

            <div id="SignIn" class="tabcontent">
                <h2>Sign In</h2>
                <form >
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
    <a href="#" onclick="openForm(event, 'SignUp')">Don't have an account? Sign Up</a>
</form>

            </div>

            <div id="SignUp" class="tabcontent">
                <h2>Sign Up</h2>
                <form action="/signup" method="post">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                    <button type="submit">Sign Up</button>
                    <a href="#" onclick="openForm(event, 'SignIn')">Already have an account? Sign In</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openForm(evt, formName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(formName).style.display = "block";
            evt.currentTarget.className += " active";
        }


document.addEventListener('DOMContentLoaded', () => {
  // SignUp form
  document.querySelector('#SignUp form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = e.target.username.value;
    const email = e.target.email.value;
    const password = e.target.password.value;

    const res = await fetch('http://localhost:5000/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    alert(data.message);
   if (res.ok) {
  alert('Signup successful! Please sign in.');
  document.getElementById("defaultOpen").click(); // Switch to Sign In tab
}
  });

  // SignIn form
document.querySelector('#SignIn form').addEventListener('submit', async (e) => {
  e.preventDefault(); // ✅ prevent default redirect
  const email = e.target.email.value;
  const password = e.target.password.value;

  const res = await fetch('http://localhost:5000/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();

  if (res.ok) {
    // store JWT
    localStorage.setItem('token', data.token);
    localStorage.setItem('userId', data.userId);
    localStorage.setItem('username', data.username);
    alert('Login successful. You can now book trips.');
    // redirect only if login is successful
    window.location.href = 'index.html';
  } else {
    alert(data.message || 'Login failed');
  }
});
});



        document.getElementById("defaultOpen").click();
        function redirectToHome(event) {
        event.preventDefault(); // stop normal form submission
        window.location.href = "index.html"; // redirect
    }
    </script>
</body>
</html>
