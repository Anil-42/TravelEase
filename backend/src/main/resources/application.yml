server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: 20
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:200}

spring:
  application:
    name: travelease-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travelease_flyway}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TravelEaseHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: ${CACHE_TYPE:caffeine}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

travelease:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  admin:
    bootstrap-username: ${TRAVELEASE_ADMIN_USERNAME:}
    bootstrap-email: ${TRAVELEASE_ADMIN_EMAIL:}
    bootstrap-password: ${TRAVELEASE_ADMIN_PASSWORD:}
    reset-password: ${TRAVELEASE_ADMIN_RESET_PASSWORD:false}
    force-password-change: ${TRAVELEASE_ADMIN_FORCE_PASSWORD_CHANGE:false}
  email:
    api-key: ${EMAIL_API_KEY:${RESEND_API_KEY:}}
    from-address: ${EMAIL_FROM_ADDRESS:onboarding@resend.dev}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    store: ${RATE_LIMIT_STORE:caffeine}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:20}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MIN:10}
    password-reset-per-minute: ${RATE_LIMIT_PW_RESET_PER_MIN:10}
    contact-per-minute: ${RATE_LIMIT_CONTACT_PER_MIN:10}
    general-per-minute: ${RATE_LIMIT_GENERAL_PER_MIN:600}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
