spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  cache:
    type: caffeine

travelease:
  jwt:
    secret: mock-jwt-secret-key-for-unit-testing-purposes-only-32-bytes-minimum
    expiration-ms: 3600000
  admin:
    bootstrap-username: ""
    bootstrap-email: ""
    bootstrap-password: ""
    reset-password: false
    force-password-change: false
  rate-limit:
    enabled: false
