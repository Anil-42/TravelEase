spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

travelease:
  jwt:
    secret: mock-jwt-secret-key-for-unit-testing-purposes-only-32-bytes-minimum
    expiration-ms: 3600000
